# SonarQube Code Quality gate scoping for the Bluestaq App Store python template.
# The gate needs line coverage of at least 80%, zero open violations, and every
# security hotspot resolved or reviewed.
#
# Sources live under src/ deliberately. The Foundations getting-started skill records
# that the platform forces sonar.sources=src; the python recipe template ships
# sonar.sources=app. Placing the package under src/ satisfies both readings, so a
# platform-side override cannot silently unscope the analysis.

sonar.projectKey=bluestaq-enlightenment
sonar.projectName=Enlightenment
sonar.sources=src
sonar.tests=tests
# Cobertura XML, emitted by `pytest` (addopts in pyproject.toml always writes it).
sonar.python.coverage.reportPaths=coverage.xml
sonar.sourceEncoding=UTF-8
sonar.python.version=3.12

# COVERAGE exclusions only, never analysis exclusions. Each needs a written reason.
# src/enlightenment/asgi.py is the gunicorn entrypoint: three lines of process wiring
# that no in-process test can execute without starting a real worker. It stays fully
# analysed for violations; only the coverage metric excludes it.
#
# src/enlightenment/ui/** is the served interface: 1,181 lines of JavaScript and the
# markup around it. The platform's generated pipeline runs `pip install` and then
# `pytest --cov`, and nothing else, so a JavaScript coverage report CANNOT exist in the
# environment the gate reads. Sonar therefore counted every executable line of app.js
# as uncovered and scored the project 77.1% against a Python figure of 97.74%. Measured
# on the V0.27.5 upload, which is what this line is here to answer.
#
# This is a suppression and it was taken to the project owner explicitly rather than
# applied quietly, because the standing rule in this repository is that no path is
# excluded and no threshold lowered to obtain a pass. Approved on 2026-09-09 on the
# narrow ground that it changes only the coverage DENOMINATOR: the files stay fully
# analysed, every JavaScript violation still counts against the zero-issue half of the
# same gate, and the alternative would have been to commit a locally generated LCOV
# report that the platform never regenerates and that goes stale in silence.
#
# The interface is not untested. It is tested from Python, over the served bytes:
# tests/test_training_api.py parses the shipped markup and asserts the contrast floor
# on nineteen ink-on-ground pairs, the absence of invented figures, and the verdict
# colour reservation. That evidence does not reach Sonar, which reads line-hit data.
#
# FOUR PATTERNS FOR ONE DIRECTORY, and the repetition is deliberate. V0.27.6 declared
# `src/enlightenment/ui/**` alone and the platform's next scan scored 76.5%, DOWN from
# 77.1%. Measured from the numbers rather than assumed: `coverage.xml` reports 3,005 of
# 3,057 Python lines covered, which is 98.30% on its own, so a reported 76.5% implies a
# denominator of about 3,928 and roughly 871 non-Python lines still being counted. That
# is app.js, unchanged in the metric, and the 45-line rise from 826 at V0.27.5 is the
# V0.27.6 refactor making the file longer. The one pattern did not match, or was not read.
#
# Which of those it is cannot be determined from here: the platform generates its own
# scanner invocation and this file's authority over it is asserted by the Foundations
# skills rather than proved by anything measurable in this repository. So the exclusion is
# now written in every form that could match - base-relative, any-depth, and by extension -
# because one upload that settles it is cheaper than four that each test one guess. The
# extension patterns are exact in effect and not merely broad: `src` holds exactly one
# `.js` file and exactly one `.html` file, both of them this interface. The six, each named
# here because the binding test requires every pattern to be written down rather than inferred
# from a neighbour:
#
#   src/enlightenment/asgi.py    the gunicorn entrypoint, three lines of process wiring
#   src/enlightenment/ui/**      the interface directory, base-relative
#   src/enlightenment/ui/**/*    the same directory, spelled for a scanner that wants a file part
#   **/ui/**                     the same directory, found at any depth
#   **/*.js                      by extension: app.js is the only JavaScript under src
#   **/*.html                    by extension: index.html is the only markup under src
#
# If the metric still does not move, the property is being overridden and no pattern will
# help. The remaining levers are then the OWNER'S: relocate the interface out of `src` so
# the forced `sonar.sources=src` never reaches it, or ask the platform team for a
# project-side exclusion. Neither is taken unilaterally.
#
# Written on ONE line, though a Java properties file permits a backslash continuation and the
# list is long enough to want one. Whether the platform's scanner reads this file at all is the
# open question above; adding a second unverified assumption about how it parses the file would
# make a failure impossible to attribute to either cause. The suite's own reader was ALSO wrong
# about continuations - it returned the value `\` for the continued form, which is a parser that
# would let a broken exclusion list ship green - and that is fixed in `_properties` rather than
# worked around here.
sonar.coverage.exclusions=src/enlightenment/asgi.py,src/enlightenment/ui/**,src/enlightenment/ui/**/*,**/ui/**,**/*.js,**/*.html
