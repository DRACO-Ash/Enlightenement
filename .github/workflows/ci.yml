# Pull-request gating. Mirrors the local verification loop exactly, so a green local run
# predicts a green pipeline. This is NOT the App Store pipeline: the platform generates its
# own and it is never hand-edited, so no .gitlab-ci.yml is committed here.
name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Least privilege: the workflow only reads the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  loop:
    name: verification loop
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install the pinned Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Install from the hash-locked lockfiles
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes --no-deps -r requirements.txt -r requirements-dev.txt

      - name: Confirm the locked install left the lockfiles unchanged
        run: git diff --exit-code -- requirements.txt requirements-dev.txt

      - name: Run the verification loop
        run: sh scripts/verify.sh

      - name: Confirm the coverage artefact the quality gate reads exists
        run: test -s coverage.xml && grep -q '<coverage' coverage.xml

  simulation:
    name: platform pipeline simulation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - name: Simulate the platform pipeline against the upload artefact
        run: sh scripts/simulate-pipeline.sh 0.1.0

  image:
    name: container image (binding leg)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # This is the binding check for the image. The authoring environment has no Docker
      # daemon, so scripts/build-image.sh defers here rather than reporting a false pass.
      - name: Build the image
        run: docker build -t enlightenment:ci .

      - name: Assert the runtime contract holds in the built image
        run: |
          set -eu
          user=$(docker image inspect enlightenment:ci --format '{{.Config.User}}')
          test "$user" = "10001:10001" || { echo "image user is '$user', expected 10001:10001"; exit 1; }
          # No setuid or setgid bit may ship. The platform policy scan stops, not warns, on this.
          found=$(docker run --rm --entrypoint sh enlightenment:ci -c \
            'find / -xdev -perm /6000 \( -type f -o -type d \) 2>/dev/null | wc -l')
          test "$found" -eq 0 || { echo "image carries $found setuid/setgid paths"; exit 1; }
          # The package manager must not ship: the scanner judges what is in the image.
          pip_present=$(docker run --rm --entrypoint sh enlightenment:ci -c \
            'command -v pip >/dev/null 2>&1 && echo yes || echo no')
          test "$pip_present" = "no" || { echo "pip ships in the runtime image"; exit 1; }

      - name: Assert the container answers the platform probes on 8080
        run: |
          set -eu
          docker run -d --name probe -p 8080:8080 enlightenment:ci
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/livez >/dev/null 2>&1; then break; fi
            sleep 2
          done
          curl -fsS -o /dev/null -w 'root %{http_code}\n' http://127.0.0.1:8080/
          for path in livez ping health; do
            curl -fsS -o /dev/null -w "$path %{http_code}\n" "http://127.0.0.1:8080/$path"
          done
          # Readiness is allowed to be 503 here: no file-storage add-on is mounted, so the
          # real-write probe is expected to report the errno rather than pass.
          curl -sS -o /dev/null -w 'readyz %{http_code}\n' http://127.0.0.1:8080/readyz
          docker logs probe
          docker rm -f probe
