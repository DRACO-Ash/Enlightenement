# SonarQube Code Quality gate scoping for the Bluestaq App Store python template.
# The gate needs line coverage of at least 80%, zero open violations, and every
# security hotspot resolved or reviewed.
#
# Sources live under src/ deliberately. The Foundations getting-started skill records
# that the platform forces sonar.sources=src; the python recipe template ships
# sonar.sources=app. Placing the package under src/ satisfies both readings, so a
# platform-side override cannot silently unscope the analysis.

sonar.projectKey=bluestaq-enlightenment
sonar.projectName=Enlightenment
sonar.sources=src
sonar.tests=tests
# Cobertura XML, emitted by `pytest` (addopts in pyproject.toml always writes it).
sonar.python.coverage.reportPaths=coverage.xml
sonar.sourceEncoding=UTF-8
sonar.python.version=3.12

# COVERAGE exclusions only, never analysis exclusions. Each needs a written reason.
# src/enlightenment/asgi.py is the gunicorn entrypoint: three lines of process wiring
# that no in-process test can execute without starting a real worker. It stays fully
# analysed for violations; only the coverage metric excludes it.
#
# src/enlightenment/ui/** is the served interface: 1,181 lines of JavaScript and the
# markup around it. The platform's generated pipeline runs `pip install` and then
# `pytest --cov`, and nothing else, so a JavaScript coverage report CANNOT exist in the
# environment the gate reads. Sonar therefore counted every executable line of app.js
# as uncovered and scored the project 77.1% against a Python figure of 97.74%. Measured
# on the V0.27.5 upload, which is what this line is here to answer.
#
# This is a suppression and it was taken to the project owner explicitly rather than
# applied quietly, because the standing rule in this repository is that no path is
# excluded and no threshold lowered to obtain a pass. Approved on 2026-09-09 on the
# narrow ground that it changes only the coverage DENOMINATOR: the files stay fully
# analysed, every JavaScript violation still counts against the zero-issue half of the
# same gate, and the alternative would have been to commit a locally generated LCOV
# report that the platform never regenerates and that goes stale in silence.
#
# The interface is not untested. It is tested from Python, over the served bytes:
# tests/test_training_api.py parses the shipped markup and asserts the contrast floor
# on nineteen ink-on-ground pairs, the absence of invented figures, and the verdict
# colour reservation. That evidence does not reach Sonar, which reads line-hit data.
sonar.coverage.exclusions=src/enlightenment/asgi.py,src/enlightenment/ui/**
