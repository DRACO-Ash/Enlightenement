[project]
name = "enlightenment"
version = "0.26.33"
description = "Orbital warfare training application for the Bluestaq App Store."
requires-python = ">=3.12,<3.13"

[tool.pytest.ini_options]
# addopts owns its flags so the platform's test stage produces the artefact the
# SonarQube gate reads even when it invokes a bare `pytest`. Only the xml report
# writes the Cobertura file; a bare run would score 0% coverage and fail the gate.
addopts = "-q --strict-markers --strict-config --cov=src --cov-branch --cov-report=xml:coverage.xml --cov-report=term-missing --cov-fail-under=80"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
branch = true
# relative_files makes the Cobertura report MACHINE-INDEPENDENT, which the SonarQube gate
# needs and the default does not give. Without it the report's <sources> element is an
# absolute path from whichever machine ran pytest - measured here as
# /home/user/Enlightenement/src - while the per-file entries are src-relative
# ("enlightenment/app.py"). On the platform runner that absolute path does not exist, so the
# importer has nothing to resolve the entries against, coverage reads 0%, and gate condition
# two (coverage at or above 80% of changed lines) fails on a suite that is actually at 98%.
#
# With it, <sources> is "src" and the entries stay src-relative, so the pair composes to
# src/enlightenment/app.py from any working directory. What is asserted locally is the
# machine-independence; SonarQube's own resolution cannot be run here and is not claimed.
relative_files = true
source = ["src"]

[tool.coverage.report]
show_missing = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
# `tools/validate_content.py` is VENDORED: it ships inside Ash's content package, it is the
# authority on whether the content is valid, and it is run rather than reimplemented. Reformatting
# it would put a diff between this copy and his source and make every future package update a
# merge. Excluded from format and lint for that reason and no other; it is still executed as leg 2
# of the verification loop, which is the check that actually matters for a file we do not own.
extend-exclude = ["tools/validate_content.py"]

[tool.ruff.lint]
# The whole recommended profile, not a hand-picked subset. The Foundations lesson is
# that hand-picking the rules an external analyser has so far named guarantees a next
# wave; inherit broadly and justify each ignore in writing.
select = [
  "E", "W",      # pycodestyle
  "F",           # pyflakes
  "I",           # isort
  "N",           # pep8-naming
  "UP",          # pyupgrade
  "B",           # flake8-bugbear
  "A",           # flake8-builtins
  "C4",          # flake8-comprehensions
  "C90",         # mccabe complexity
  "DTZ",         # flake8-datetimez
  "T20",         # flake8-print
  "PT",          # flake8-pytest-style
  "RET",         # flake8-return
  "SIM",         # flake8-simplify
  "ARG",         # flake8-unused-arguments
  "PTH",         # flake8-use-pathlib
  "ERA",         # eradicate (commented-out code)
  "S",           # flake8-bandit, the local mirror of Sonar security hotspots
  "TRY",         # tryceratops
  "PL",          # pylint
  "PERF",        # perflint
  "RUF",         # ruff-specific
]
ignore = [
  # Sonar's own rule allows a single-line f-string in a raise; TRY003 would force an
  # exception class per message and add violations rather than remove them.
  "TRY003",
]

[tool.ruff.lint.pylint]
# create_app is a dependency-injection factory: six keyword-only injection points is the
# design, not accidental growth. Sonar's own parameter rule (S107) caps at seven.
max-args = 7

[tool.ruff.lint.mccabe]
# Sonar rule S3776 caps COGNITIVE complexity at 15. Cyclomatic complexity is a
# different, looser measure, so the local cap is set tighter at 10: a function that
# passes here cannot fail the platform on complexity.
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
# Tests assert with `assert` (S101 is a production rule) and bind to loopback in
# fixtures (S104 does not apply to a test server on 127.0.0.1).
# S101 assert is the test idiom; S104/S105/S106 flag the fixture token and bind address
# that exist to EXERCISE the production controls; PLR2004 literals are the expected
# values under test; SLF001 lets a test assert a private memory bound directly.
"tests/*" = ["S101", "S104", "S105", "S106", "PLR2004", "ARG001", "SLF001", "PLC0415"]

# `tools/` holds workstation scripts that never ship: they are excluded from the upload allowlist
# in `scripts/package-appstore.sh` and from the image build context in `.dockerignore`, and a
# contract test holds both. T201 is the only exemption: a command-line tool reports progress and
# results on stdout and stderr, which is its interface, not a stray debug print. Everything else
# ruff raises against them is fixed rather than exempted - the pinned linter found a real
# `file://` scheme hole in `udl_characterise.py` and that was closed, not suppressed.
"tools/*" = ["T201"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
# One `files` list rather than `packages` plus `files`: mypy accepts exactly one of module,
# package or file targets and errors out on the pair, which is how this was found.
#
# `tools/` is checked at the same strictness as the application. It does not ship - it is excluded
# from the upload allowlist and the image context, with a contract test on both - but it is the code
# that holds real UDL credentials and writes the one artefact that crosses the boundary, so it is
# the last place to relax a check.
files = ["src/enlightenment", "tools"]
strict = true
warn_unreachable = true

# sgp4 ships no type stubs. Narrowed to the one module rather than relaxed globally, and
# confined to the propagation wrapper for exactly this reason: the library's untyped surface
# stops at that file, which converts its raw tuple into a typed StateVector with the frame
# named. Nothing else in the codebase sees an untyped value from it.
[[tool.mypy.overrides]]
module = ["sgp4.*"]
ignore_missing_imports = true
